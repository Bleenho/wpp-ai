name: Deploy VPS (GHCR + Dokploy)

# Pipeline da VPS Hostinger: typecheck -> build AQUI -> push GHCR -> webhook do
# Dokploy. Convive com deploy.yml (EC2) ate o corte; depois, apagar deploy.yml.
#
# Settings -> Secrets and variables -> Actions -> Variables:
#   DOKPLOY_WEBHOOK_WPPAI  URL do webhook do Compose no Dokploy.
#                          Vazia = so publica a imagem (fase de ensaio).

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Typecheck, build & push (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/wpp-ai:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/wpp-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redeploy (Dokploy)
    needs: build
    runs-on: ubuntu-latest
    if: vars.DOKPLOY_WEBHOOK_WPPAI != ''
    steps:
      - name: Webhook
        run: curl -fsS -X POST "${{ vars.DOKPLOY_WEBHOOK_WPPAI }}"
