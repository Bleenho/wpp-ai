name: Deploy VPS (GHCR + Dokploy)

# Pipeline da VPS Hostinger: typecheck -> build AQUI -> push GHCR -> webhook do
# Dokploy. Convive com deploy.yml (EC2) ate o corte; depois, apagar deploy.yml.
#
# Settings -> Secrets and variables -> Actions -> Variables:
#   DOKPLOY_WEBHOOK_WPPAI  URL do webhook do Compose no Dokploy.
#                          Vazia = so publica a imagem (fase de ensaio).

on:
  push:
    # `vps-prep` e' temporaria: o Dokploy le o compose do clone desta branch
    # durante o preparo, sem acordar o deploy.yml da EC2 (que so escuta `main`).
    # REMOVER desta lista no merge do corte.
    branches: [main, vps-prep]
    paths-ignore:
      - "infra/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Typecheck, build & push (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/wpp-ai:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/wpp-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redeploy (Dokploy)
    needs: build
    runs-on: ubuntu-latest
    if: vars.DOKPLOY_WEBHOOK_WPPAI != ''
    steps:
      - name: Webhook
        # O Dokploy quer o header `x-github-event` e um corpo com o ref. Sem
        # isso ele responde {"message":"Branch Not Match"} com status **301** --
        # e `curl -f` nao falha em 3xx, so em 4xx/5xx. Era por isso que este job
        # ficava VERDE sem deployar nada: em 15/09 a VPS ainda rodava a imagem
        # buildada em 11/09, e nenhum sinal apontava para isso.
        # Dai a conferencia explicita do 200 -- o `-f` sozinho nao basta aqui.
        run: |
          code=$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -d '{"ref":"refs/heads/main","repository":{"default_branch":"main"}}' \
            -o /tmp/dokploy.json -w '%{http_code}' \
            "${{ vars.DOKPLOY_WEBHOOK_WPPAI }}")
          echo "HTTP $code -- $(cat /tmp/dokploy.json)"
          [ "$code" = "200" ] || { echo "::error::Dokploy nao deployou (esperado HTTP 200)"; exit 1; }
